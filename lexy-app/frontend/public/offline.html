<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a237e" />
    <title>Offline — Lexy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #fafafa;
        color: #1a237e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: clamp(48px, 12vw, 96px) clamp(20px, 5vw, 32px);
        text-align: center;
      }
      h1 {
        font-size: clamp(22px, 6vw, 28px);
        margin: 0 0 12px;
      }
      p {
        color: #555;
        font-size: 15px;
        line-height: 1.55;
        margin: 0 0 24px;
      }
      button {
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        background: #1a237e;
        color: #fff;
        cursor: pointer;
        min-height: 44px;
        touch-action: manipulation;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Lexy needs an internet connection to fetch videos, sentences, and
        chat. Reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
